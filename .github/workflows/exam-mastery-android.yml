name: Exam Mastery – build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'exam-mastery/**'
      - '.github/workflows/exam-mastery-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exam-mastery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exam-mastery/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Validate knowledge base, type-check and build web app
        run: npm run build
      - name: Copy web app into Android project
        run: npx cap sync android
      - name: Load permanent signing key
        env:
          KS: ${{ secrets.EXAM_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Signing key secret EXAM_KEYSTORE_B64 is missing. Add it under Settings > Secrets and variables > Actions. Builds are blocked so that no randomly-signed APK (which cannot update the installed app) is ever published."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/exam.jks"
          echo "EXAM_KEYSTORE_PATH=$RUNNER_TEMP/exam.jks" >> "$GITHUB_ENV"
      - name: Build APK (signed with the permanent key)
        working-directory: exam-mastery/android
        env:
          EXAM_KEYSTORE_PASSWORD: ${{ secrets.EXAM_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee cert.txt
          grep -qi "e3054339" <(tr -d ':' < cert.txt | tr 'A-F' 'a-f') || { echo "::error::APK is not signed with the permanent Exam Mastery key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: exam-mastery-debug-apk
          path: exam-mastery/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ExamMastery.apk
      - name: Publish as a GitHub Release (direct phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exam-mastery-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Exam Mastery (test build ${{ github.run_number }})
          body: Tap ExamMastery.apk below on your Android phone to download and install.
          files: exam-mastery/ExamMastery.apk
          make_latest: true
